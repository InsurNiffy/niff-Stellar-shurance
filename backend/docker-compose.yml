version: '3.8'

x-app-env: &app-env
  NODE_ENV: development
  DATABASE_URL: postgresql://postgres:password@db:5432/niffyinsure
  REDIS_URL: redis://redis:6379/0
  STELLAR_RPC_URL: http://stellar:8000/soroban/rpc
  STELLAR_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"

x-app-base: &app-base
  build: .
  environment: *app-env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - .:/app
    - /app/node_modules

services:
  db:
    image: postgres:16-alpine
    container_name: niff_stellar_db
    environment:
      POSTGRES_DB: niffyinsure
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *app-base
    container_name: niff_stellar_api
    command: ["node", "dist/main.js"]
    environment:
      <<: *app-env
      PROCESS_ROLE: api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app-base
    container_name: niff_stellar_worker
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
      PROCESS_ROLE: worker

  indexer:
    <<: *app-base
    container_name: niff_stellar_indexer
    command: ["node", "dist/indexer.js"]
    environment:
      <<: *app-env
      PROCESS_ROLE: indexer

  stellar:
    image: stellar/quickstart:latest
    container_name: niff_stellar_quickstart
    profiles: ["stellar"]
    command: ["--standalone", "--enable-soroban-rpc"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/soroban/rpc || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Redis failover drill (issue #1683). Mirrors docs/ops/redis-failover-drill.md:
  # start Redis -> trigger throttler -> stop Redis -> assert graceful degradation
  # -> restart Redis -> confirm normal operation. Run with:
  #   docker compose -f backend/docker-compose.yml --profile drill run --rm redis-failover-drill
  redis-failover-drill:
    <<: *app-base
    container_name: niff_stellar_redis_failover_drill
    profiles: ["drill"]
    command: ["node", "dist/scripts/redis-failover-drill.js"]
    environment:
      <<: *app-env
      PROCESS_ROLE: drill
      REDIS_FAILOVER_DRILL: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
