groups:
  - name: niffyinsure_api
    rules:
      # ── HTTP 5xx alert ────────────────────────────────────────────────────
      - alert: High5xxRate
        expr: |
          sum(rate(http_5xx_errors_total{app="niffyinsure-api"}[10m])) > 1
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Elevated HTTP 5xx error rate"
          description: >
            More than 1 5xx error/s over the last 10 minutes. Check requestId
            correlated logs and recent deploys for root cause.

      # ── Post-deploy error-rate spike alert (blue-green auto-rollback) ─────
      # Fires when the 5xx error rate spikes shortly after a traffic switch.
      # The deploy pipeline watches this alert (and the smoke test result) to
      # trigger an automatic rollback to the previous (blue) environment.
      - alert: PostDeployErrorRateSpike
        expr: |
          sum(rate(http_5xx_errors_total{app="niffyinsure-api"}[5m])) > 0.5
        for: 2m
        labels:
          severity: critical
          team: backend
          rollback: "true"
        annotations:
          summary: "Post-deploy 5xx error rate spike"
          description: >
            The 5xx error rate spiked above 0.5 errors/s within the post-deploy
            observation window. The blue-green deploy pipeline should roll back
            traffic to the previous environment.

      # ── RPC error alert ───────────────────────────────────────────────────
      - alert: HighRpcErrorRate
        expr: |
          sum(rate(rpc_errors_total{app="niffyinsure-api"}[10m])) > 0.5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Elevated Soroban RPC error rate"
          description: >
            More than 0.5 RPC errors/s. Possible Soroban RPC degradation
            or contract deployment issue.

      # ── High latency alert ────────────────────────────────────────────────
      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{app="niffyinsure-api"}[10m]))
            by (le)
          ) > 3
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "p99 HTTP latency above 3 s"
          description: >
            The 99th-percentile request latency has exceeded 3 seconds
            for 10 consecutive minutes.

      # ── RPC latency alert ─────────────────────────────────────────────────
      - alert: HighRpcP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(rpc_call_duration_seconds_bucket{app="niffyinsure-api"}[10m]))
            by (le, rpc_method)
          ) > 8
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Soroban RPC p95 latency above 8 s"
          description: >
            RPC method {{ $labels.rpc_method }} p95 latency exceeded 8 seconds.
            Soroban network may be congested.

      # ── Indexer lag alert ──────────────────────────────────────────────────
      - alert: IndexerLagHigh
        expr: |
          max_over_time(indexer_lag_ledgers{app="niffyinsure-api"}[10m]) > 30
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Indexer lag above 30 ledgers"
          description: >
            The indexer has fallen behind the network head by more than 30
            ledgers for at least 10 minutes. Check indexer health and queue
            processing.

      # ── Solvency buffer alert ─────────────────────────────────────────────
      - alert: SolvencyBufferLow
        expr: |
          solvency_buffer_stroops{app="niffyinsure-api"} < solvency_buffer_threshold_stroops{app="niffyinsure-api"}
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Solvency buffer below configured threshold"
          description: >
            The contract solvency buffer has fallen below the configured safety
            threshold. Investigate approved obligations and treasury balance.

      # ── Solvency ratio alerts (maintenance solvency monitor) ──────────────
      # The solvency monitor job reads treasury and reserved coverage from the
      # contract and exposes solvency_ratio (treasury / reserved coverage).
      # Warning fires below the warning threshold; critical below the critical
      # threshold. Thresholds are configurable via SOLVENCY_WARNING_RATIO and
      # SOLVENCY_CRITICAL_RATIO and exported as solvency_warning_ratio /
      # solvency_critical_ratio.
      - alert: SolvencyRatioWarning
        expr: |
          solvency_ratio{app="niffyinsure-api"} < solvency_warning_ratio{app="niffyinsure-api"}
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Solvency ratio below warning threshold"
          description: >
            The on-chain solvency ratio (treasury / reserved coverage) is
            {{ $value | humanizePercentage }}, below the warning threshold.
            Review approved obligations and treasury balance.

      - alert: SolvencyRatioCritical
        expr: |
          solvency_ratio{app="niffyinsure-api"} < solvency_critical_ratio{app="niffyinsure-api"}
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Solvency ratio below critical threshold"
          description: >
            The on-chain solvency ratio (treasury / reserved coverage) is
            {{ $value | humanizePercentage }}, below the critical threshold.
            Immediate action required: halt new approvals and top up treasury.

      # ── Solvency monitor job failure alert ────────────────────────────────
      - alert: SolvencyMonitorJobFailed
        expr: |
          increase(maintenance_job_failures_total{app="niffyinsure-api",job="solvency_monitor"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Solvency monitor job failed"
          description: >
            The solvency monitor maintenance job has failed at least once in
            the last 15 minutes. Check job logs and contract RPC connectivity.

      # ── Data retention job alerts ─────────────────────────────────────────
      - alert: RetentionJobFailed
        expr: |
          increase(maintenance_job_failures_total{app="niffyinsure-api",job="data_retention"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Data retention job failed"
          description: >
            The data retention maintenance job has failed at least once in the
            last 15 minutes. Records past their retention period may not be
            purged or anonymized. Check job logs.

      # ── Pin check job alerts ──────────────────────────────────────────────
      - alert: PinCheckJobFailed
        expr: |
          increase(maintenance_job_failures_total{app="niffyinsure-api",job="pin_check"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Pin check job failed"
          description: >
            The IPFS pin check maintenance job has failed at least once in the
            last 15 minutes. Evidence CIDs may be unpinned. Check job logs and
            IPFS gateway health.

      - alert: PinCheckMissingPins
        expr: |
          increase(pin_check_missing_total{app="niffyinsure-api"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Missing IPFS pins detected"
          description: >
            The pin check job found {{ $value }} evidence CID(s) missing from
            IPFS in the last hour. Re-pin attempts are made automatically;
            investigate if the count keeps growing.

      # ── Privacy request job alerts ────────────────────────────────────────
      - alert: PrivacyRequestJobFailed
        expr: |
          increase(maintenance_job_failures_total{app="niffyinsure-api",job="privacy_requests"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Privacy request job failed"
          description: >
            The privacy request maintenance job has failed at least once in the
            last 15 minutes. Export or delete requests may be stuck. Check job
            logs and the privacy_requests table.

      # ── Dead-letter queue depth alert ───────────
