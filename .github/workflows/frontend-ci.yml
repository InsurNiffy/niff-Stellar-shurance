name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  ci:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://api.example.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node_modules-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-frontend-node_modules-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (Jest)
        id: jest
        continue-on-error: true
        run: npm test -- --json --outputFile=jest-results.json || true

      - name: Flaky test report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          JEST_RESULTS: frontend/jest-results.json
        with:
          script: |
            const fs = require('fs');
            const path = process.env.JEST_RESULTS;
            if (!fs.existsSync(path)) {
              core.info('No Jest results file found; skipping flaky report.');
              return;
            }
            const results = JSON.parse(fs.readFileSync(path, 'utf8'));
            const flaky = [];
            for (const suite of results.testResults || []) {
              for (const t of suite.assertionResults || []) {
                if (t.status === 'passed' && Array.isArray(t.retryReasons) && t.retryReasons.length > 0) {
                  flaky.push({ name: t.fullName || t.title, retries: t.retryReasons.length });
                }
              }
            }
            const distinct = [...new Map(flaky.map(f => [f.name, f])).values()];
            core.info(`Detected ${distinct.length} distinct flaky test(s).`);
            for (const f of distinct) {
              core.warning(`Flaky test (${f.retries} retr${f.retries === 1 ? 'y' : 'ies'}): ${f.name}`);
            }
            if (distinct.length > 3) {
              core.setFailed(`Too many flaky tests: ${distinct.length} distinct (threshold: 3).`);
            }

      - name: Fail on test failure
        if: steps.jest.outcome == 'failure'
        run: exit 1
