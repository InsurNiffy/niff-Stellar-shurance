name: Secrets Rotation Reminders

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday 09:00 UTC
  pull_request:
    paths:
      - docs/ops/.secret-rotation-dates.json
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-rotation-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check rotation deadlines
        uses: actions/github-script@v7
        env:
          ONCALL_GITHUB_HANDLE: ${{ vars.ONCALL_GITHUB_HANDLE }}
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('docs/ops/.secret-rotation-dates.json', 'utf8'));
            const intervals = data._intervals ?? {};
            const DEFAULT_INTERVAL = 90;
            const ALERT_WINDOW = 14;
            const DAY = 86_400_000;
            const today = new Date(new Date().toISOString().split('T')[0]);

            const overdue = [];
            const dueSoon = [];
            for (const [secret, lastRotated] of Object.entries(data)) {
              if (secret.startsWith('_') || !/^\d{4}-\d{2}-\d{2}$/.test(String(lastRotated))) continue;
              const interval = typeof intervals[secret] === 'number' ? intervals[secret] : DEFAULT_INTERVAL;
              const due = new Date(new Date(lastRotated).getTime() + interval * DAY);
              const daysLeft = Math.round((due - today) / DAY);
              const row = { secret, lastRotated, due: due.toISOString().split('T')[0], daysLeft };
              if (daysLeft < 0) {
                overdue.push(row);
                core.warning(`Secret "${secret}" is overdue for rotation (due ${row.due}, ${-daysLeft} days ago)`);
              } else if (daysLeft <= ALERT_WINDOW) {
                dueSoon.push(row);
                core.notice(`Secret "${secret}" is due for rotation in ${daysLeft} days (${row.due})`);
              }
            }

            if (!overdue.length && !dueSoon.length) {
              core.info('All secrets are within their rotation window.');
              return;
            }

            // Pull-request runs only annotate; scheduled/manual runs alert on-call.
            if (context.eventName === 'pull_request') return;

            const table = (rows) => [
              '| Secret | Last rotated | Due | Days left |',
              '|--------|--------------|-----|-----------|',
              ...rows.map((r) => `| \`${r.secret}\` | ${r.lastRotated} | ${r.due} | ${r.daysLeft} |`),
            ].join('\n');

            const oncall = process.env.ONCALL_GITHUB_HANDLE;
            let body = oncall ? `@${oncall.replace(/^@/, '')} — on-call rotation alert.\n\n` : '';
            if (overdue.length) body += `## Overdue\n\n${table(overdue)}\n\n`;
            if (dueSoon.length) body += `## Due within ${ALERT_WINDOW} days\n\n${table(dueSoon)}\n\n`;
            body += 'Follow `docs/ops/secrets-management-runbook.md`, then update `docs/ops/.secret-rotation-dates.json`.\n';

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'secrets-rotation',
              state: 'open',
            });

            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Secrets rotation due (${today.toISOString().split('T')[0]})`,
                body,
                labels: ['secrets-rotation', 'security'],
              });
            }

            if (overdue.length) core.setFailed(`${overdue.length} secret(s) overdue for rotation`);
