name: Contracts CI

on:
  push:
    branches:
      - main
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/contracts-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/contracts-ci.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0097

  ci:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --target wasm32v1-none --release -- -D warnings

      - name: Test
        run: cargo test --workspace --features testutils

      - name: Premium calculator standalone integration tests
        run: cargo test -p premium_calculator --features testutils --test integration

      # `cargo test --workspace` auto-discovers every file in
      # contracts/niffyinsure/tests/, so the appeal suites already run above.
      # They are also listed explicitly here so a rename or a stray `#![cfg(...)]`
      # feature gate makes CI fail loudly instead of silently skipping them.
      - name: Appeal contract tests
        run: |
          cargo test -p niffyinsure --features testutils \
            --test appeal \
            --test appeal_approved_payout_parity \
            --test appeal_departed_voter \
            --test appeal_dispute_mutual_exclusion \
            --test appeal_elevated_quorum \
            --test appeal_max_appeals_regression \
            --test appeal_new_voter \
            --test appeal_non_claimant_property \
            --test appeal_vote_reset \
            --test open_appeal_boundary

      - name: Gas benchmarks
        run: |
          cargo test --test gas_benchmarks --features testutils -- --nocapture
          cargo test -p niffyinsure --features testutils --test gas_appeal_footprint -- --nocapture

      - name: Build WASM
        run: cargo build --release --target wasm32v1-none --workspace
