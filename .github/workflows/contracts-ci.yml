name: Contracts CI

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/ops/audit-exceptions.md'
      - '.github/workflows/contracts-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'EVENT_DICTIONARY.md'
      - '.github/workflows/contracts-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'EVENT_DICTIONARY.md'
      - '.github/workflows/contracts-ci.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & Test Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build contracts
        run: cargo build --workspace --release

      - name: Run contract tests
        run: cargo test --workspace

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --json > audit-report.json || true

      - name: Annotate open audit exceptions
        run: |
          echo "::group::Open cargo audit exceptions (docs/ops/audit-exceptions.md)"
          if [ -f docs/ops/audit-exceptions.md ]; then
            awk '/^\|/ && !/^\| *-+/ && !/^\| *ID/ { print }' docs/ops/audit-exceptions.md | while IFS= read -r line; do
              echo "::warning title=Open audit exception::${line//|/ - }"
            done
          else
            echo "::warning title=Audit exceptions::docs/ops/audit-exceptions.md not found"
          fi
          echo "::endgroup::"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: audit-report.json
          if-no-files-found: ignore
          fi
          echo "::endgroup::"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: audit-report.json
          if-no-files-found: ignore

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Cache Rust build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.soroban_sdk }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.soroban_sdk }}-

      - name: Bump soroban-sdk to latest stable
        if: matrix.soroban_sdk == 'latest'
        run: |
          # Relax the exact-pin constraint just for this leg of the matrix
          # so `cargo update` is free to pull the newest published release.
          sed -i 's/soroban-sdk = { version = "=\([0-9.]*\)"/soroban-sdk = { version = "\1"/' \
            contracts/niffyinsure/Cargo.toml contracts/premium_calculator/Cargo.toml
          cargo update -p soroban-sdk

      - name: Test (pinned toolchain)
        if: matrix.soroban_sdk == 'pinned'
        run: cargo test --workspace --features testutils

      - name: Test (latest toolchain)
        if: matrix.soroban_sdk == 'latest'
        run: cargo test --workspace --features testutils

  openapi:
    name: OpenAPI Spec Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Regenerate OpenAPI spec
        working-directory: backend
        run: npm run openapi:generate

      - name: Fail on OpenAPI spec drift
        working-directory: backend
        run: |
          if ! git diff --exit-code -- openapi.json; then
            echo "::error::backend/openapi.json is stale. Run 'npm run openapi:generate' in backend/ and commit the result."
            exit 1
          fi

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npm run test:unit

      - name: Run integration tests (Testcontainers Postgres + Redis)
        working-directory: backend
        run: npm run test:integration

      - name: Run e2e tests
        working-directory: backend
        run: npm run test:e2e

      - name: Enforce coverage threshold
        working-directory: backend
        run: npm run test:coverage
