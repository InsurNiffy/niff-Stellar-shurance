name: Contracts CI

on:
  push:
    branches:
      - main
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/contracts-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/contracts-ci.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0097

  ci:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --target wasm32v1-none --release -- -D warnings

      - name: Test
        run: cargo test --workspace --features testutils

      - name: Premium calculator standalone integration tests
        run: cargo test -p premium_calculator --features testutils --test integration

      # `cargo test --workspace` auto-discovers every file in
      # contracts/niffyinsure/tests/, so the appeal suites already run above.
      # They are also listed explicitly here so a rename or a stray `#![cfg(...)]`
      # feature gate makes CI fail loudly instead of silently skipping them.
      - name: Appeal contract tests
        run: |
          cargo test -p niffyinsure --features testutils \
            --test appeal \
            --test appeal_approved_payout_parity \
            --test appeal_departed_voter \
            --test appeal_dispute_mutual_exclusion \
            --test appeal_elevated_quorum \
            --test appeal_max_appeals_regression \
            --test appeal_new_voter \
            --test appeal_non_claimant_property \
            --test appeal_vote_reset \
            --test open_appeal_boundary

      - name: Gas benchmarks
        run: |
          cargo test --test gas_benchmarks --features testutils -- --nocapture
          cargo test -p niffyinsure --features testutils --test gas_appeal_footprint -- --nocapture

      - name: Build WASM
        run: cargo build --release --target wasm32v1-none --workspace

      - name: WASM size check
        run: |
          WASM=target/wasm32v1-none/release/niffyinsure.wasm
          BUDGET_BYTES=204800
          SIZE=$(wc -c < "${WASM}")
          echo "niffyinsure.wasm size: ${SIZE} bytes (budget: ${BUDGET_BYTES})"
          if [ "${SIZE}" -gt "${BUDGET_BYTES}" ]; then
            echo "ERROR: WASM size ${SIZE} exceeds budget ${BUDGET_BYTES}" >&2
            exit 1
          fi

  contract-tests-matrix:
    name: Contract tests (${{ matrix.soroban_sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        soroban_sdk: [pinned, latest]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    # A failure on `latest` is a non-blocking warning to investigate; only
    # `pinned` failures fail the required check for this job.
    continue-on-error: ${{ matrix.soroban_sdk == 'latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Cache Rust build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.soroban_sdk }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.soroban_sdk }}-

      - name: Bump soroban-sdk to latest stable
        if: matrix.soroban_sdk == 'latest'
        run: |
          # Relax the exact-pin constraint just for this leg of the matrix
          # so `cargo update` is free to pull the newest published release.
          sed -i 's/soroban-sdk = { version = "=\([0-9.]*\)"/soroban-sdk = { version = "\1"/' \
            contracts/niffyinsure/Cargo.toml contracts/premium_calculator/Cargo.toml
          cargo update -p soroban-sdk

      - name: Test (pinned toolchain)
        if: matrix.soroban_sdk == 'pinned'
        run: cargo test --workspace --features testutils

      - name: Test (latest toolchain)
        if: matrix.soroban_sdk == 'latest'
        run: cargo test --workspace --features testutils

  openapi:
    name: OpenAPI Spec Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Regenerate OpenAPI spec
        working-directory: backend
        run: npm run openapi:generate

      - name: Fail on OpenAPI spec drift
        working-directory: backend
        run: |
          if ! git diff --exit-code -- openapi.json; then
            echo "::error::backend/openapi.json is stale. Run 'npm run openapi:generate' in backend/ and commit the result."
            exit 1
          fi

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npm run test:unit

      - name: Run integration tests (Testcontainers Postgres + Redis)
        working-directory: backend
        run: npm run test:integration

      - name: Run e2e tests
        working-directory: backend
        run: npm run test:e2e

      - name: Enforce coverage threshold
        working-directory: backend
        run: npm run test:coverage
