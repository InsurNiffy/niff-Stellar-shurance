name: Contracts CI

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/ops/audit-exceptions.md'
      - '.github/workflows/contracts-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/ops/audit-exceptions.md'
      - '.github/workflows/contracts-ci.yml'

jobs:
  build-and-test:
    name: Build & Test Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build contracts
        run: cargo build --workspace --release

      - name: Run contract tests
        run: cargo test --workspace

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --json > audit-report.json || true

      - name: Annotate open audit exceptions
        run: |
          echo "::group::Open cargo audit exceptions (docs/ops/audit-exceptions.md)"
          if [ -f docs/ops/audit-exceptions.md ]; then
            awk '/^\|/ && !/^\| *-+/ && !/^\| *ID/ { print }' docs/ops/audit-exceptions.md | while IFS= read -r line; do
              echo "::warning title=Open audit exception::${line//|/ - }"
            done
          else
            echo "::warning title=Audit exceptions::docs/ops/audit-exceptions.md not found"
          fi
          echo "::endgroup::"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: audit-report.json
          if-no-files-found: ignore
