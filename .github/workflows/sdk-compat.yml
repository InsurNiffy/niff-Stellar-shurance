name: SDK Compatibility

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: test (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [pinned, next-minor]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Resolve soroban-sdk version
        id: sdk
        run: |
          manifest=contracts/niffyinsure/Cargo.toml
          pinned=$(grep -oP 'soroban-sdk\s*=\s*\{\s*version\s*=\s*"=\K[^"]+' "$manifest" | head -n1)
          if [ "${{ matrix.sdk }}" = "next-minor" ]; then
            # Next release line after the pinned one (e.g. 25.3.1 -> 26.x)
            major=$(echo "$pinned" | cut -d. -f1)
            echo "version=$((major + 1))" >> "$GITHUB_OUTPUT"
          else
            echo "version=$pinned" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin soroban-sdk to ${{ steps.sdk.outputs.version }}
        if: matrix.sdk == 'next-minor'
        run: |
          sed -i -E 's/(soroban-sdk = \{ version = )"=[^"]+"/\1"${{ steps.sdk.outputs.version }}"/' \
            contracts/niffyinsure/Cargo.toml
          cargo update -p niffyinsure

      - name: Run contract tests
        run: cargo test -p niffyinsure

  report-failure:
    name: report failure
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'contract-owner';
            const title = `SDK compatibility failure: soroban-sdk next-minor (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              'The weekly SDK compatibility job failed against `soroban-sdk` next-minor.',
              '',
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              '',
              'See `docs/sdk-upgrade-checklist.md` for the upgrade procedure.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              assignees: [owner],
              labels: ['sdk-compat', 'ci'],
            });
