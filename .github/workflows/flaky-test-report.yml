name: Flaky Test Report

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-flaky:
    name: Detect flaky tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [frontend, backend]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    env:
      CI: true
      NEXT_PUBLIC_API_URL: https://api.example.com
      NODE_ENV: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs the suite with jest.retryTimes enabled (see jest.flaky-retry.js)
      # and captures per-test invocation counts. This step is informational
      # only — it never fails the build; a real failure on the pinned/final
      # attempt is still caught by the workspace's own CI job.
      - name: Run tests with retry tracking
        continue-on-error: true
        run: npx jest --json --outputFile=jest-results.json || true

      - name: Report tests that needed a retry
        run: |
          node -e '
            const fs = require("fs");
            const path = "jest-results.json";
            if (!fs.existsSync(path)) { console.log("No jest results found, skipping."); process.exit(0); }
            const results = JSON.parse(fs.readFileSync(path, "utf8"));
            const flaky = [];
            for (const suite of results.testResults || []) {
              for (const test of suite.testResults || []) {
                if ((test.invocations || 1) > 1 && test.status === "passed") {
                  flaky.push(`${suite.testFilePath}: ${test.fullName}`);
                }
              }
            }
            if (flaky.length === 0) {
              console.log("No flaky (retry-then-pass) tests detected in this run.");
            } else {
              console.log("::warning::Flaky tests detected (passed only after retry) — consider quarantining per docs/flaky-test-quarantine.md");
              for (const name of flaky) {
                console.log(`::warning::Flaky test: ${name}`);
              }
            }
          '

      - name: Upload flaky test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa9 # v4.6.2
        with:
          name: flaky-tests-report-${{ matrix.workspace }}
          path: ${{ matrix.workspace }}/jest-results.json
          retention-days: 14

  annotate-flaky:
    name: Annotate flaky tests on PR
    needs: detect-flaky
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download flaky test reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e880d8f7c1dd2226f88 # v4.1.8
        with:
          pattern: flaky-tests-report-*
          path: flaky-reports

      - name: Post flaky test annotations
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const root = 'flaky-reports';
            const flaky = [];

            if (fs.existsSync(root)) {
              for (const workspace of fs.readdirSync(root)) {
                const resultsPath = path.join(root, workspace, 'jest-results.json');
                if (!fs.existsSync(resultsPath)) continue;
                let results;
                try {
                  results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
                } catch (err) {
                  core.warning(`Could not parse ${resultsPath}: ${err.message}`);
                  continue;
                }
                for (const suite of results.testResults || []) {
                  for (const test of suite.testResults || []) {
                    if ((test.invocations || 1) > 1 && test.status === 'passed') {
                      flaky.push({
                        workspace,
                        file: suite.testFilePath,
                        name: test.fullName,
                        invocations: test.invocations,
                      });
                    }
                  }
                }
              }
            }

            if (flaky.length === 0) {
              core.info('No flaky (retry-then-pass) tests detected across workspaces.');
              return;
            }

            for (const test of flaky) {
              core.warning(
                `Flaky test (${test.workspace}, ${test.invocations} invocations): ${test.name}`,
                { title: 'Flaky test detected', file: test.file }
              );
            }

            const distinct = new Set(flaky.map((t) => `${t.workspace}:${t.file}:${t.name}`));
            const summary = `Detected ${distinct.size} distinct flaky test(s) across frontend and backend. See docs/flaky-test-quarantine.md for quarantine guidance.`;
            core.notice(summary, { title: 'Flaky test report' });

            if (distinct.size > 3) {
              core.setFailed(
                `${distinct.size} distinct flaky tests detected in this PR (threshold: 3). Quarantine or fix them per docs/flaky-test-quarantine.md.`
              );
            }
