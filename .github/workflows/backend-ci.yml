name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  ci:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node_modules-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-backend-node_modules-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check premium golden-vector parity
        run: |
          CONTRACT_VECTORS="../contracts/niffyinsure/golden-vectors.json"
          BACKEND_VECTORS="src/premium/golden-vectors.json"
          if [ -f "$CONTRACT_VECTORS" ]; then
            CONTRACT_SEM=$(node -e "const v=require('$CONTRACT_VECTORS'); console.log(v._meta?.contractSemver ?? '')")
            BACKEND_SEM=$(node -e "const v=require('./$BACKEND_VECTORS'); console.log(v._meta?.contractSemver ?? '')")
            if [ "$CONTRACT_SEM" != "$BACKEND_SEM" ]; then
              echo "::error::Contract golden vectors ($CONTRACT_SEM) differ from backend copy ($BACKEND_SEM). Run scripts/refresh-vectors.ts and commit src/premium/golden-vectors.json."
              exit 1
            fi
          fi
