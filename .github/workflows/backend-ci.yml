name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  hooks:
    name: Hooks presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify pre-commit hook exists
        run: |
          if [ ! -f .githooks/pre-commit ]; then
            echo "::error::Missing .githooks/pre-commit — run 'make install-hooks' and commit the hook."
            exit 1
          fi

  ci:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node_modules-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-backend-node_modules-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check premium golden-vector parity
        run: |
          CONTRACT_VECTORS="../contracts/niffyinsure/golden-vectors.json"
          BACKEND_VECTORS="src/premium/golden-vectors.json"
          if [ -f "$CONTRACT_VECTORS" ]; then
            CONTRACT_SEM=$(node -e "const v=require('$CONTRACT_VECTORS'); console.log(v._meta?.contractSemver ?? '')")
            BACKEND_SEM=$(node -e "const v=require('./$BACKEND_VECTORS'); console.log(v._meta?.contractSemver ?? '')")
            if [ "$CONTRACT_SEM" != "$BACKEND_SEM" ]; then
              echo "::error::Contract golden vectors ($CONTRACT_SEM) differ from backend copy ($BACKEND_SEM). Run scripts/refresh-vectors.ts and commit src/premium/golden-vectors.json."
              exit 1
            fi
          fi

  smoke-test:
    name: Post-deploy smoke test
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
      ERROR_RATE_THRESHOLD: '0.05'
    steps:
      - name: Smoke test after traffic switch
        id: smoke
        run: |
          if [ -z "$DEPLOY_BASE_URL" ]; then
            echo "::error::DEPLOY_BASE_URL is not configured; cannot run post-deploy smoke test."
            exit 1
          fi
          BASE="${DEPLOY_BASE_URL%/}"
          failed=0
          for path in /api/health /api/chain/info /api/claims; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 3 --retry-delay 2 "$BASE$path" || echo '000')
            echo "GET $path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::Smoke test failed: GET $path returned $code (expected 200)."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Check post-deploy error rate
        id: error-rate
        run: |
          if [ -z "$DEPLOY_BASE_URL" ]; then
            echo "::error::DEPLOY_BASE_URL is not configured; cannot check error rate."
            exit 1
          fi
          BASE="${DEPLOY_BASE_URL%/}"
          # Allow metrics to settle after the traffic switch.
          sleep 30
          rate=$(curl -s --max-time 10 "$BASE/api/health/metrics" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);const r=j.errorRate ?? j.error_rate ?? j.errors?.rate;process.stdout.write(String(r ?? ''))}catch(e){process.stdout.write('')}})" || echo '')
          if [ -z "$rate" ]; then
            echo "::warning::Could not read post-deploy error rate; skipping spike check."
            exit 0
          fi
          echo "Post-deploy error rate: $rate (threshold $ERROR_RATE_THRESHOLD)"
          node -e "const r=Number(process.argv[1]);const t=Number(process.argv[2]);if(!Number.isFinite(r)){console.log('::warning::Invalid error rate value; skipping spike check.');process.exit(0)}if(r>t){console.log('::error::Post-deploy error rate '+r+' exceeds threshold '+t+'.');process.exit(1)}" "$rate" "$ERROR_RATE_THRESHOLD"

      - name: Auto-rollback on failure
        if: failure()
        run: |
          echo "::error::Post-deploy smoke test or error-rate check failed — triggering auto-rollback."
          if [ -z "$DEPLOY_BASE_URL" ]; then
            echo "::error::DEPLOY_BASE_URL is not configured; cannot trigger rollback."
            exit 1
          fi
          BASE="${DEPLOY_BASE_URL%/}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST "$BASE/api/deploy/rollback" || echo '000')
          echo "POST /api/deploy/rollback -> $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Auto-rollback request failed with status $code."
            exit 1
          fi
          echo "Auto-rollback triggered successfully."

  redis-failover-drill:
    name: Redis failover drill
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: backend
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node_modules-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-backend-node_modules-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      # Drill per docs/ops/redis-failover-drill.md:
      # start Redis -> trigger throttler -> stop Redis -> assert graceful
      # degradation -> restart Redis -> confirm normal operation.
      - name: Redis failover drill
        run: |
          set -euo pipefail

          echo "::group::1. Confirm Redis is up"
          redis-cli ping
          echo "::endgroup::"

          echo "::group::2. Trigger throttler while Redis is healthy"
          npm run test:e2e -- --runInBand --testPathPattern 'redis-failover-drill' --testNamePattern 'healthy'
          echo "::endgroup::"

          echo "::group::3. Stop Redis"
          sudo systemctl stop redis-server
          if redis-cli ping >/dev/null 2>&1; then
            echo "::error::Redis still responding after stop"
            exit 1
          fi
          echo "Redis stopped"
          echo "::endgroup::"

          echo "::group::4. Assert graceful degradation during outage"
          npm run test:e2e -- --runInBand --testPathPattern 'redis-failover-drill' --testNamePattern 'degraded'
          echo "::endgroup::"

          echo "::group::5. Restart Redis"
          sudo systemctl start redis-server
          for i in $(seq 1 30); do
            if redis-cli ping >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          redis-cli ping
          echo "::endgroup::"

          echo "::group::6. Confirm normal throttling after restart"
          npm run test:e2e -- --runInBand --testPathPattern 'redis-failover-drill' --testNamePattern 'recovered'
          echo "::endgroup::"

  address-normalization:
    name: Address normalization check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niffy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niffy
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Assert stored addresses are normalized
        run: npm run check:addresses
