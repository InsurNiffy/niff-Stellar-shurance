name: Prisma Migration Dry-Run

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/prisma/**'
      - '.github/workflows/prisma-migration-dry-run.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  migration-dry-run:
    name: Migration dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niffyinsure_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migration dry-run
        id: diff
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niffyinsure_shadow
        run: |
          DIFF=$(npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script 2>&1) || true
          {
            echo "diff<<DIFF_EOF"
            echo "$DIFF"
            echo "DIFF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check for destructive operations
        id: check-destructive
        run: |
          if printf '%s' "${{ steps.diff.outputs.diff }}" | grep -qiE '^\s*(DROP|DELETE)\b'; then
            echo "destructive=true" >> "$GITHUB_OUTPUT"
          else
            echo "destructive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post diff as PR comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const diff = `${{ steps.diff.outputs.diff }}`;
            const destructive = '${{ steps.check-destructive.outputs.destructive }}' === 'true';
            const warning = destructive
              ? '> **Warning:** Destructive operations detected (`DROP`/`DELETE`). '
                + 'Add the `migration-approved` label to allow merging.\n\n'
              : '';
            const body = [
              '## Prisma migration dry-run',
              '',
              warning,
              '```sql',
              diff.trim() || '(no pending migrations — schema is in sync with migration history)',
              '```',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) =>
                c.user?.login === 'github-actions[bot]' &&
                c.body?.startsWith('## Prisma migration dry-run'),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on unapproved destructive operations
        if: steps.check-destructive.outputs.destructive == 'true'
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$PR_LABELS" | grep -q '"migration-approved"'; then
            echo "Destructive migration approved via label — passing."
          else
            echo "::error::Destructive migration (DROP/DELETE) requires the 'migration-approved' label before merging."
            exit 1
          fi
