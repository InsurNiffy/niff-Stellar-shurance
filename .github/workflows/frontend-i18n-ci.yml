name: Frontend i18n CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/messages/**'
      - 'frontend/scripts/check-translations.js'
      - 'frontend/scripts/check-plurals.js'
      - '.github/workflows/frontend-i18n-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/messages/**'
      - 'frontend/scripts/check-translations.js'
      - 'frontend/scripts/check-plurals.js'
      - '.github/workflows/frontend-i18n-ci.yml'

jobs:
  locale-checks:
    name: Locale parity & plural checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails the build when a key present in the base (en) locale is
      # missing from any other supported locale.
      - name: Check locale key parity
        run: npm run check-translations

      # Fails the build when a countable-looking string (e.g. "{days} days")
      # lacks ICU plural syntax.
      - name: Check ICU plural forms
        run: npm run check-plurals
